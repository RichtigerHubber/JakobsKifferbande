<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galgenraten Bilder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .image-container {
            display: flex;
            gap: 20px;
        }
        .image-item {
            text-align: center;
        }
        .underscores {
            margin-top: 10px;
            font-size: 24px;
            letter-spacing: 10px;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="image-item">
            <img src="Haus.png" alt="Bild 1" width="200">
            <div class="underscores">_ _ _ _ _ _</div>
        </div>
        <div class="image-item">
            <img src="Neo.jpg" alt="Bild 2" width="200">
            <div class="underscores">_ _ _ _ _ _ _ _</div>
        </div>
    </div>
</body>
</html>
